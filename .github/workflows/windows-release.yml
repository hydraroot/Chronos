name: Chronos Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag matches project version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION ($expectedTag)."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Check Python syntax
        run: python -m py_compile chronos.py

      - name: Build portable Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx `
            --name "Chronos" `
            --icon "chronos.ico" `
            --version-file "chronos_version.txt" `
            --add-data "chronos.ico;." `
            --add-data "chronos_icon.png;." `
            --add-data "chronos_tray.png;." `
            --collect-all PIL `
            --hidden-import PIL._tkinter_finder `
            chronos.py

      - name: Create portable release archive
        shell: pwsh
        run: Compress-Archive -Path "dist/Chronos/*" -DestinationPath "Chronos-1.0-Windows-x64-unsigned.zip" -Force

      - name: Upload unsigned artifact for traceability
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Chronos-1.0-Windows-x64-unsigned
          path: Chronos-1.0-Windows-x64-unsigned.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish unsigned GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "Chronos-1.0-Windows-x64-unsigned.zip" `
            --title "Chronos 1.0" `
            --notes-file "docs/RELEASE_NOTES_1.0.md"
